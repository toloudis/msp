name: Windows build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  # Compiles every entry point of the shaders converted from Effects (.fx)
  # to plain HLSL with fxc, one entry point and profile at a time.
  converted-shaders:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile converted shaders with fxc
        shell: pwsh
        run: |
          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\fxc.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          $manifests = Get-ChildItem -Recurse -Filter *.effect.json LibXLT | ForEach-Object FullName
          python Tools/fx2hlsl/compile_check.py --compiler fxc --exe $fxc.FullName --verbose $manifests

  build-mainapp:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # Debug|x64 is the configuration the project files keep linkable (its
        # library paths point at the per-library vcpkg installs); Release|x64
        # still points at old prebuilt DirectXTex/FX11 folders.
        configuration: [ Debug ]
    env:
      VCPKG_ROOT: C:\vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-binary-cache
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ hashFiles('**/vcpkg.json', '**/vcpkg-configuration.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Integrate vcpkg with MSBuild
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          & "$env:VCPKG_ROOT\vcpkg.exe" integrate install

      # GraphicsDX11 uses packages.config NuGet packages (e.g. D3DX),
      # restored into MachStudio/Source/packages
      - name: Restore NuGet packages
        working-directory: MachStudio/Source
        run: nuget restore MachStudio.sln

      # /m builds independent projects in parallel. UseMultiToolTask also
      # compiles the source files within each project in parallel (none of
      # the projects set /MP), and EnforceProcessCountAcrossBuilds keeps the
      # total number of cl.exe processes at the core count.
      - name: Build MainApp (${{ matrix.configuration }}|x64)
        working-directory: MachStudio/Source
        run: >
          msbuild MachStudio.sln
          /t:MainApp
          /p:Configuration=${{ matrix.configuration }}
          /p:Platform=x64
          /m
          /p:UseMultiToolTask=true
          /p:EnforceProcessCountAcrossBuilds=true
          /nologo
          /v:minimal
